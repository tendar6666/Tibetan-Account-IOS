name: Build Native iOS App (.ipa & Xcode Project)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native App on macOS Cloud
    runs-on: macos-14

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Capacitor & Generate Native iOS Project
        run: |
          npm install
          npm run prepare-www
          npx cap add ios
          npx cap sync ios

      - name: 4. Generate 1024x1024 Tibetan Account Book App Icon & Configure Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Tibetan Account Book'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Tibetan Account Book'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '2.0.0'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '2'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Attach photos of bills, receipts, and vouchers directly to your accounting entries.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Select bill and receipt photos from your library to attach to accounting vouchers.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Save exported receipt slips and accounting backups to your device.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST" || true

          if [ -f "AppStore_Icon_1024x1024.png" ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp AppStore_Icon_1024x1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
            echo "Copied perfected AppStore_Icon_1024x1024.png into AppIcon.appiconset"
          else
          cat << 'EOF' > generate_icon.swift
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          let rect = NSRect(origin: .zero, size: size)
          NSColor(red: 0.533, green: 0.075, blue: 0.216, alpha: 1.0).setFill()
          rect.fill()
          let borderPath = NSBezierPath(roundedRect: rect.insetBy(dx: 48, dy: 48), xRadius: 180, yRadius: 180)
          borderPath.lineWidth = 18
          NSColor(red: 0.992, green: 0.878, blue: 0.278, alpha: 0.9).setStroke()
          borderPath.stroke()
          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .center
          let attrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.boldSystemFont(ofSize: 340),
              .foregroundColor: NSColor(red: 0.996, green: 0.953, blue: 0.780, alpha: 1.0),
              .paragraphStyle: paragraph
          ]
          let text = "རྩིས།" as NSString
          text.draw(in: NSRect(x: 0, y: 240, width: 1024, height: 520), withAttributes: attrs)
          image.unlockFocus()
          if let tiff = image.tiffRepresentation,
             let rep = NSBitmapImageRep(data: tiff),
             let png = rep.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"))
          }
          EOF
          swift generate_icon.swift || true
          rm -f generate_icon.swift
          fi

      - name: 5. Configure CocoaPods for Unsigned Build & Compile Native .ipa
        run: |
          node -e '
            const fs = require("fs");
            const podfilePath = "ios/App/Podfile";
            if (fs.existsSync(podfilePath)) {
              let pf = fs.readFileSync(podfilePath, "utf8");
              pf = pf.replace(
                "assertDeploymentTarget(installer)",
                "assertDeploymentTarget(installer)\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n      config.build_settings[\"EXPANDED_CODE_SIGN_IDENTITY\"] = \"\"\n    end\n  end"
              );
              fs.writeFileSync(podfilePath, pf, "utf8");
            }
          '
          cd ios/App
          pod install

          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              clean build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              clean build
          fi

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../Tibetan-Account-Book-iOS.ipa Payload
          cd ../..
          zip -qry Tibetan-Account-Book-Xcode-Project.zip ios/

      - name: 6. Upload Native iOS .ipa Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Account-Book-iOS-IPA
          path: Tibetan-Account-Book-iOS.ipa
          retention-days: 90

      - name: 7. Upload Complete Xcode Project (For App Store Connect Submission)
        uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Account-Book-Xcode-Project
          path: Tibetan-Account-Book-Xcode-Project.zip
          retention-days: 90

      - name: 8. Build, Sign & Upload directly to App Store Connect
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_PRIVATE_KEY" ] || [ -z "$APP_STORE_KEY_ID" ] || [ -z "$APP_STORE_ISSUER_ID" ]; then
            echo "ℹ️ App Store Connect API secrets not configured yet. Skipping direct upload."
            exit 0
          fi
          echo "🔑 App Store Connect API credentials detected! Preparing automated cloud signing & upload..."
          mkdir -p ~/.private_keys
          echo "$APP_STORE_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APP_STORE_KEY_ID}.p8

          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          cd ios/App
          # Build signed release archive using App Store Connect cloud signing
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"

          # Upload archive directly to App Store Connect
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ../../exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"

          echo "🎉 Successfully uploaded build to App Store Connect!"
