<!DOCTYPE html>
<html lang="bo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>བོད་ཀྱི་རྩིས་དེབ། • Tibetan Account Book</title>

  <!-- iOS Native Web App (PWA) Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tibetan Account Book" />
  <meta name="theme-color" content="#881337" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tibetan & System Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Windows iOS Preview Control Bar (Automatically hidden on real iPhones) -->
  <header class="desktop-toolbar no-print">
    <div class="toolbar-brand">
      <span class="toolbar-badge">༄༅། །བོད་ཀྱི་རྩིས་དེབ།</span>
      <div>
        <div style="font-size:14px;font-weight:700;">Tibetan Account Book • བོད་ཀྱི་རྩིས་དེབ། (iOS App)</div>
        <div style="font-size:12px;color:#CBD5E1;">
          Built on Windows • Installable on iPhone via Safari ("Add to Home Screen")
        </div>
      </div>
    </div>

    <div class="toolbar-actions">
      <button id="btnFrameMode" class="toolbar-btn active" onclick="toggleViewMode('frame')">
        📱 iPhone 16 Pro View
      </button>
      <button id="btnFullMode" class="toolbar-btn" onclick="toggleViewMode('full')">
        🖥️ Expanded View
      </button>
      <button class="toolbar-btn" onclick="resetDemoData()">
        🔄 Reset Sample Data
      </button>
    </div>
  </header>

  <!-- iPhone 16 Pro Simulator Shell -->
  <main class="iphone-shell">
    <!-- iOS Status Bar & Dynamic Island -->
    <div class="ios-status-bar">
      <span>9:41</span>
      <div class="dynamic-island">
        <div class="dynamic-island-Dot"></div>
      </div>
      <span>5G 🔋</span>
    </div>

    <!-- Toast Notification Banner -->
    <div id="iosToast" class="ios-toast"></div>

    <!-- App Top Navigation Header -->
    <div class="app-header">
      <div class="header-top-row">
        <div class="app-title-wrap">
          <div class="app-logo-circle" title="༄༅། །བོད་ཀྱི་རྩིས་དེབ།">རྩིས།</div>
        </div>

        <div class="header-controls">
          <!-- Instant Language Switcher: Bilingual / Tibetan / English -->
          <select id="langSelect" class="pill-select" onchange="changeLanguage(this.value)" title="Language Mode">
            <option value="bo_en">བོད་ + EN</option>
            <option value="bo">བོད་ཡིག</option>
            <option value="en">English</option>
          </select>

          <!-- Multi-Currency Switcher -->
          <select id="currSelect" class="pill-select" onchange="changeCurrency(this.value)" title="Currency">
            <option value="INR">₹ INR</option>
            <option value="USD">$ USD</option>
            <option value="NPR">रू NPR</option>
            <option value="EUR">€ EUR</option>
            <option value="CAD">CA$ CAD</option>
          </select>

          <!-- Settings & Accessibility (Text Size / Custom Currency) -->
          <button type="button" class="settings-btn" onclick="openAppSettingsModal()" title="Settings & Text Size">
            ⚙️
          </button>
        </div>
      </div>

      <!-- Account Book Selector (Shop / Monastery / Personal) -->
      <div class="book-selector-bar">
        <select id="bookSelect" class="book-select-dropdown" onchange="changeBook(this.value)" title="Active Account Book"></select>
        <button class="new-book-btn" onclick="openNewBookModal()" title="Add New Account Book">
          + རྩིས་དེབ།
        </button>
      </div>
      <div style="display:none;" aria-hidden="true"><button type="button" onclick="openHelpModal()">❓ རོགས་རམ།</button></div>
    </div>

    <!-- Dynamic iOS Tab View Content -->
    <section id="iosContent" class="ios-content"></section>

    <!-- iOS Bottom Tab Bar -->
    <nav id="iosTabBar" class="ios-tab-bar"></nav>
    <div class="ios-home-indicator"></div>

    <!-- iOS Slide-Up Bottom Sheet Modal -->
    <div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div id="modalSheet" class="modal-sheet"></div>
    </div>

    <!-- Hidden multi-file input for attaching bills, receipts and PDFs -->
    <input
      type="file"
      id="billFileInput"
      accept="image/*,application/pdf"
      multiple
      style="display:none"
      onchange="handleBillFileInputChange(event)"
    />

    <!-- Lightbox Document Preview Modal Container (Feature 15) -->
    <div id="lightboxContainer" style="display:none;"></div>

    <!-- First-Run Onboarding Wizard Modal Container (Feature 24) -->
    <div id="onboardingModal" class="modal-backdrop onboarding-modal-container" style="display:none;" onclick="if(event.target===this) closeOnboardingWizard()"></div>

    <!-- Bilingual FAQ & Help Modal Container (Feature 25) -->
    <div id="helpModal" class="modal-backdrop help-modal-container" style="display:none;" onclick="if(event.target===this) closeHelpModal()"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
