<!DOCTYPE html>
<html lang="bo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>བོད་ཀྱི་རྩིས་དེབ། • Tibetan Account Book</title>

  <!-- iOS Native Web App (PWA) Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tibetan Account Book" />
  <meta name="theme-color" content="#881337" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tibetan & System Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Windows iOS Preview Control Bar (Automatically hidden on real iPhones) -->
  <header class="desktop-toolbar no-print">
    <div class="toolbar-brand">
      <span class="toolbar-badge">༄༅། །བོད་ཀྱི་རྩིས་དེབ།</span>
      <div>
        <div style="font-size:14px;font-weight:700;">Tibetan Account Book • བོད་ཀྱི་རྩིས་དེབ། (iOS App)</div>
        <div style="font-size:11.5px;color:#CBD5E1;">
          Built on Windows • Installable on iPhone via Safari ("Add to Home Screen")
        </div>
      </div>
    </div>

    <div class="toolbar-actions">
      <button id="btnFrameMode" class="toolbar-btn active" onclick="toggleViewMode('frame')">
        📱 iPhone 16 Pro View
      </button>
      <button id="btnFullMode" class="toolbar-btn" onclick="toggleViewMode('full')">
        🖥️ Expanded View
      </button>
      <button class="toolbar-btn" onclick="resetDemoData()">
        🔄 Reset Sample Data
      </button>
    </div>
  </header>

  <!-- iPhone 16 Pro Simulator Shell -->
  <main class="iphone-shell">
    <!-- iOS Status Bar & Dynamic Island -->
    <div class="ios-status-bar">
      <span>9:41</span>
      <div class="dynamic-island">
        <div class="dynamic-island-Dot"></div>
      </div>
      <span>5G 🔋</span>
    </div>

    <!-- Toast Notification Banner -->
    <div id="iosToast" class="ios-toast"></div>

    <!-- App Top Navigation Header -->
    <div class="app-header">
      <div class="header-top-row">
        <div class="app-title-wrap">
          <div class="app-logo-circle">རྩིས།</div>
          <div>
            <div class="app-title-main">བོད་ཀྱི་རྩིས་དེབ།</div>
            <span class="app-title-sub">Tibetan Account Book</span>
          </div>
        </div>

        <div class="header-controls">
          <!-- Instant Language Switcher: Bilingual / Tibetan / English -->
          <select id="langSelect" class="pill-select" onchange="changeLanguage(this.value)" title="Language Mode">
            <option value="bo_en">བོད་ + EN</option>
            <option value="bo">བོད་ཡིག</option>
            <option value="en">English</option>
          </select>

          <!-- Multi-Currency Switcher -->
          <select id="currSelect" class="pill-select" onchange="changeCurrency(this.value)" title="Currency">
            <option value="INR">₹ INR</option>
            <option value="USD">$ USD</option>
            <option value="NPR">रू NPR</option>
            <option value="EUR">€ EUR</option>
            <option value="CAD">CA$ CAD</option>
          </select>
        </div>
      </div>

      <!-- Account Book Selector (Shop / Monastery / Personal) -->
      <div class="book-selector-bar">
        <select id="bookSelect" class="book-select-dropdown" onchange="changeBook(this.value)"></select>
        <button class="new-book-btn" style="background:rgba(255,255,255,0.18);color:#FFFFFF;border-color:rgba(255,255,255,0.35);" onclick="openManageBooksModal()" title="Edit or Delete Account Books / Companies">
          ⚙️ དོ་དམ།
        </button>
        <button class="new-book-btn" onclick="openNewBookModal()">+ རྩིས་དེབ།</button>
        <button class="new-book-btn" style="background:rgba(56,189,248,0.22);color:#7DD3FC;border-color:rgba(56,189,248,0.5);" onclick="openBackupAndCloudModal()">
          ☁️ སྤོ་བཤུགས།
        </button>
        <button class="new-book-btn" style="background:rgba(255,255,255,0.18);color:#FFFFFF;border-color:rgba(255,255,255,0.35);" onclick="shareAppToOthers()" title="Share App with Friends & Community">
          📤 མཉམ་སྤྱོད།
        </button>
      </div>
    </div>

    <!-- Dynamic iOS Tab View Content -->
    <section id="iosContent" class="ios-content"></section>

    <!-- iOS Bottom Tab Bar -->
    <nav id="iosTabBar" class="ios-tab-bar"></nav>
    <div class="ios-home-indicator"></div>

    <!-- iOS Slide-Up Bottom Sheet Modal -->
    <div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div id="modalSheet" class="modal-sheet"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
